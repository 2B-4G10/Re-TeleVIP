// An application, not a library: only an APK yields the dex that :app embeds (generateDexHolder).
plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.televip.SettingsAdapter'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.televip.SettingsAdapter"
        minSdk = 27
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"

    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Same JDK as :app, which embeds this module's dex.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Provided by the target client at runtime; only this module's own dex is injected.
    compileOnly libs.appcompat
    compileOnly libs.material
}