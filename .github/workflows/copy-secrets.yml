name: Copy secrets

# One-off: copies this repository's release secrets into the private development repository.
# Values go straight from here to GitHub's secrets API and are never printed.
on:
  push:
    branches: [claude/project-thread-k056gz]
    paths: ['.github/workflows/copy-secrets.yml']

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Copy the secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_COPY_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MODULES_REPO_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::SECRETS_COPY_TOKEN is not set."; exit 1; }
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD MODULES_REPO_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is empty here; skipped."
              continue
            fi
            printf '%s' "${!name}" | gh secret set "$name" --repo 2B-4G10/Re-TeleVIP-dev
            echo "Copied $name."
          done
          gh secret list --repo 2B-4G10/Re-TeleVIP-dev
