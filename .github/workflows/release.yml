name: Release

# Publishes a GitHub release with the APKs attached whenever a version tag is pushed:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# The release notes are the matching "## <version>" section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # A tag that disagrees with the app's own version would publish an APK that reports a
      # different version than the release it hangs under.
      - name: Check the tag matches versionName
        run: |
          version=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag#V}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run the unit tests
        timeout-minutes: 12
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build the APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      # Same rule as the Build APK workflow: an unsigned release APK cannot be installed, so it
      # is only attached when the signing secrets made it a signed one.
      - name: Collect the APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/TeleVip-$VERSION-debug.apk"
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          case "$release_apk" in
            *unsigned*) echo "::warning::No signing secrets are set; only the debug APK is attached." ;;
            *) cp "$release_apk" "artifacts/TeleVip-$VERSION-release.apk" ;;
          esac
          ls -lh artifacts

      - name: Write the release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          1. Download **TeleVip-…-debug.apk** below (the release APK is only attached when it is signed) and install it.
          2. In **LSPosed 1.10+** or **Vector 2.2+**: **Modules** → enable **TeleVip** → tick your Telegram clients.
          3. **Force stop** the client and reopen it.
          EOF
          cat notes.md

      # gh ships on the runner image; GITHUB_TOKEN with contents: write is all it needs.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.apk --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.apk \
              --title "TeleVip $GITHUB_REF_NAME" --notes-file notes.md --latest
          fi
