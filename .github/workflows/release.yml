name: Release

# Publishes a GitHub release "v<versionName>" with the APKs attached. It runs when:
#
#   - a commit to main changes app/build.gradle (a version bump) and that release does not exist
#     yet - so bumping versionName is all it takes to ship;
#   - a v* tag is pushed (the tag must match versionName);
#   - it is started by hand from the Actions tab.
#
# The release notes are the matching "## <version>" section of CHANGELOG.md.
on:
  push:
    branches: [main]
    paths: ['app/build.gradle']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # A tag that disagrees with the app's own version would publish an APK that reports a
      # different version than the release it hangs under. On main, an existing release for this
      # version means the push changed something else in build.gradle: nothing to publish.
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ] && [ "$GITHUB_REF_NAME" != "V$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle."
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          fi
          publish=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] \
              && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            publish=false
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Run the unit tests
        if: steps.version.outputs.publish == 'true'
        timeout-minutes: 12
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build the APKs
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      # Same rule as the Build APK workflow: an unsigned release APK cannot be installed, so it
      # is only attached when the signing secrets made it a signed one.
      - name: Collect the APKs
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/TeleVip-$VERSION-debug.apk"
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          case "$release_apk" in
            *unsigned*) echo "::warning::No signing secrets are set; only the debug APK is attached." ;;
            *) cp "$release_apk" "artifacts/TeleVip-$VERSION-release.apk" ;;
          esac
          ls -lh artifacts

      - name: Write the release notes
        if: steps.version.outputs.publish == 'true'
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          1. Download **TeleVip-…-debug.apk** below (the release APK is only attached when it is signed) and install it.
          2. In **LSPosed 1.10+** or **Vector 2.2+**: **Modules** → enable **TeleVip** → tick your Telegram clients.
          3. **Force stop** the client and reopen it.
          EOF
          cat notes.md

      # gh ships on the runner image; GITHUB_TOKEN with contents: write is all it needs.
      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh creates the tag on this commit when it does not exist yet.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" artifacts/*.apk --target "$GITHUB_SHA" \
              --title "TeleVip $TAG" --notes-file notes.md --latest
          fi
