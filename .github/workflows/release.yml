name: Release

# Publishes release v<versionName> with the APKs attached, when versionName changes on main,
# when a matching v* tag is pushed, or by hand. Notes come from CHANGELOG.md.
on:
  push:
    branches: [main]
    paths: ['app/build.gradle']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v7

      # On main, an existing release means build.gradle changed without a version bump.
      - name: Work out the version
        id: version
        run: |
          version=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ] && [ "$GITHUB_REF_NAME" != "V$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version."
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          fi
          publish=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] \
              && gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            publish=false
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        if: steps.version.outputs.publish == 'true'
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.version.outputs.publish == 'true'

      - name: Restore the signing keystore
        if: steps.version.outputs.publish == 'true' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: .github/scripts/restore-keystore.sh

      - name: Test and build
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect the APKs
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/TeleVip-$VERSION-debug.apk"
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          case "$release_apk" in
            *unsigned*) echo "::warning::No signing secrets set; only the debug APK is attached." ;;
            *) cp "$release_apk" "artifacts/TeleVip-$VERSION-release.apk" ;;
          esac

      - name: Write the release notes
        if: steps.version.outputs.publish == 'true'
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          1. Download **TeleVip-…-debug.apk** below and install it.
          2. In **LSPosed 1.10+** or **Vector 2.2+**: **Modules** → enable **TeleVip** → tick your Telegram clients.
          3. **Force stop** the client and reopen it.
          EOF

      # gh creates the tag on this commit if it does not exist yet.
      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" artifacts/*.apk --target "$GITHUB_SHA" \
              --title "TeleVip $TAG" --notes-file notes.md --latest
          fi
