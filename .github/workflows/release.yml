name: Release

# Publishes release v<versionName> with the APKs attached, when versionName changes on main,
# when a matching v* tag is pushed, or by hand. Notes come from CHANGELOG.md. With the
# MODULES_REPO_TOKEN secret set, the release is also published to the Xposed Modules Repo.
on:
  push:
    branches: [main]
    paths: ['app/build.gradle']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Tokens and the signing secrets go only to the steps that use them, never to the other
    # steps or the actions they run.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_MODULES_REPO_TOKEN: ${{ secrets.MODULES_REPO_TOKEN != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On main, an existing release means build.gradle changed without a version bump.
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ] && [ "$GITHUB_REF_NAME" != "V$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version."
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          fi
          publish=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] \
              && gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            publish=false
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.version.outputs.publish == 'true'
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.version.outputs.publish == 'true'

      - name: Restore the signing keystore
        if: steps.version.outputs.publish == 'true' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: .github/scripts/restore-keystore.sh

      - name: Test and build
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Remove the signing keystore
        if: always()
        run: rm -f release.jks keystore.properties

      # Only the signed release APK is published: a debug build is for testing, from Build APK.
      - name: Collect the APK
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p artifacts
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          case "$release_apk" in
            ""|*unsigned*)
              echo "::error::The release APK is not signed - check the KEYSTORE_* secrets. Nothing was published."
              exit 1 ;;
            *) cp "$release_apk" "artifacts/TeleVip-$VERSION-release.apk" ;;
          esac

      - name: Write the release notes
        if: steps.version.outputs.publish == 'true'
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          1. Download **TeleVip-…-release.apk** below and install it (uninstall a debug build first).
          2. In **Vector 2.2+**: **Modules** → enable **Re: TeleVIP** → tick your Telegram clients.
          3. **Force stop** the client and reopen it.

          No root? Patch your Telegram client with **LSPatch 1.2** (JingMatrix) and add Re: TeleVIP to it.
          EOF

      # gh creates the tag on this commit if it does not exist yet.
      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" artifacts/*.apk --target "$GITHUB_SHA" \
              --title "Re: TeleVIP $TAG" --notes-file notes.md --latest
          fi

      # modules.lsposed.org: Xposed-Modules-Repo/<applicationId>. MODULES_REPO_TOKEN is a classic
      # token with the public_repo scope from an account that maintains that repository.
      - name: Publish to the Xposed Modules Repo
        if: steps.version.outputs.publish == 'true' && env.HAS_MODULES_REPO_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
        run: .github/scripts/publish-modules-repo.sh
