name: Client watch

# Every week, downloads the latest Telegram, Nekogram, Cherrygram, Nagram, NagramX and Forkgram
# (the last three only when their latest GitHub release carries an APK) and checks that every
# TeleVip feature's hook points still resolve in them (ClientApkTest). A client release that
# breaks something fails the run (GitHub emails you) with the affected features in its summary,
# and opens an issue if the repository has issues enabled; a release that works again closes it.
# Run it by hand with an APK URL (e.g. a direct APKPure download) to check any
# other build.
#
# When every client checks out on the weekly run, anything merged since the last release -
# Dependabot's Monday updates, fingerprint fixes - is released: the patch version and
# versionCode are bumped, the commits are listed in CHANGELOG.md, and Release publishes it.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Check only this APK (direct download URL; .apk or .xapk)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  clients:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          if [ -n "$APK_URL" ]; then
            matrix=$(jq -nc --arg u "$APK_URL" '{include: [{client: "Manual check", url: $u}]}')
          else
            matrix='{"include":[
              {"client":"Telegram","url":"https://telegram.org/dl/android/apk","issue":true},
              {"client":"Nekogram","repo":"Nekogram/Nekogram","asset":"arm64-v8a","issue":true},
              {"client":"Cherrygram","repo":"arsLan4k1390/Cherrygram","asset":"arm64","issue":true},
              {"client":"Nagram","repo":"NextAlone/Nagram","asset":"arm64","issue":true,"optional":true},
              {"client":"NagramX","repo":"risin42/NagramX","asset":"arm64","issue":true,"optional":true},
              {"client":"Forkgram","repo":"forkgram/TelegramAndroid","asset":"arm64","issue":true,"optional":true}]}'
          fi
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.client }}
    needs: clients
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.clients.outputs.matrix) }}

    env:
      GH_TOKEN: ${{ github.token }}
      CLIENT: ${{ matrix.client }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Download the latest build
        id: apk
        env:
          REPO: ${{ matrix.repo }}
          URL: ${{ matrix.url }}
          ASSET: ${{ matrix.asset }}
          OPTIONAL: ${{ matrix.optional }}
        run: |
          if [ -n "$REPO" ]; then
            names=$(gh release view --repo "$REPO" --json assets --jq '.assets[].name' | grep -i '\.apk$' || true)
            name=$(echo "$names" | grep -i -- "$ASSET" | head -n1)
            [ -n "$name" ] || name=$(echo "$names" | head -n1)
            if [ -z "$name" ]; then
              # Variants that do not attach an APK to every release are skipped, not failed.
              [ "$OPTIONAL" = "true" ] && { echo "::notice::No APK in the latest $REPO release; skipped."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
              echo "::error::No APK in the latest $REPO release."; exit 1
            fi
            gh release download --repo "$REPO" --pattern "$name" --output client.apk
          else
            # Big downloads from some servers drop mid-transfer: resume until complete.
            for attempt in 1 2 3 4 5; do
              curl -fsSL --retry 3 --retry-all-errors -C - -o client.apk "$URL" && break
              [ "$attempt" = 5 ] && { echo "::error::Could not download $URL."; exit 1; }
              sleep 10
            done
          fi

          # An .xapk (APKPure) is a zip of split APKs: the code lives in the largest one.
          if unzip -l client.apk manifest.json >/dev/null 2>&1; then
            inner=$(unzip -Z1 client.apk '*.apk' | while read -r f; do
              echo "$(unzip -Zl client.apk "$f" | awk 'NR==1{print $4}') $f"; done | sort -rn | head -n1 | cut -d' ' -f2-)
            unzip -p client.apk "$inner" > base.apk && mv base.apk client.apk
          fi

          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n1)
          badging=$("$aapt2" dump badging client.apk | head -n1)
          version=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "VERSION=$version ($code)" >> "$GITHUB_ENV"

      - name: Check the hook points
        id: check
        if: steps.apk.outputs.skip != 'true'
        continue-on-error: true
        env:
          TELEVIP_CLIENT_APK: ${{ github.workspace }}/client.apk
          TELEVIP_CLIENT_REPORT: ${{ github.workspace }}/report.md
        run: >-
          ./gradlew :app:testDebugUnitTest --rerun
          --tests 'com.my.televip.obfuscate.resolve.ClientApkTest' --stacktrace

      - name: Report
        if: steps.apk.outputs.skip != 'true'
        env:
          OUTCOME: ${{ steps.check.outcome }}
          OPEN_ISSUES: ${{ matrix.issue }}
        run: |
          [ -f report.md ] || echo "The check produced no report; see the \"Check the hook points\" log." > report.md
          { echo "## $CLIENT $VERSION"; echo; cat report.md; } > body.md
          cat body.md | tee -a "$GITHUB_STEP_SUMMARY"
          # Issues are off by default on forks; the failed run and this summary still report it.
          [ "$OPEN_ISSUES" = "true" ] || exit 0
          [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" = "true" ] || exit 0

          title="Client watch: $CLIENT"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ "$OUTCOME" = "success" ]; then
            [ -z "$number" ] || gh issue close "$number" --comment "Every hook point resolves again on $CLIENT $VERSION."
          elif [ -z "$number" ]; then
            gh issue create --title "$title" --body-file body.md
          elif ! gh issue view "$number" --json body,comments --jq '.body, .comments[].body' | grep -qF "$CLIENT $VERSION"; then
            gh issue comment "$number" --body-file body.md
          fi

      - name: Fail when a feature broke
        if: steps.apk.outputs.skip != 'true' && steps.check.outcome != 'success'
        run: exit 1

  release:
    name: Release pending changes
    needs: check
    # Weekly runs only, and only when every client passed: a broken client comes first.
    if: github.event_name == 'schedule' && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump the version if anything changed since the last release
        id: bump
        run: |
          version=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          code=$(grep -m1 'versionCode' app/build.gradle | tr -dc '0-9')
          last="v$version"
          if ! git rev-parse -q --verify "refs/tags/$last" >/dev/null; then
            echo "::notice::$last has not been released yet; Release will publish it on its own."
            exit 0
          fi
          # Only what ends up in the APK counts; README, workflow or test-only changes do not.
          if git diff --quiet "$last" HEAD -- app/src/main app/build.gradle build.gradle settings.gradle \
              gradle.properties gradle; then
            echo "Nothing to release since $last."
            exit 0
          fi

          next="${version%.*}.$(( ${version##*.} + 1 ))"
          sed -i "s/versionCode = $code/versionCode = $((code + 1))/; s/versionName = \"$version\"/versionName = \"$next\"/" \
              app/build.gradle
          {
            echo "# Changelog"
            echo
            echo "## $next — weekly update"
            echo
            git log --no-merges --format='- %s' "$last"..HEAD -- app/src/main app/build.gradle build.gradle \
                settings.gradle gradle.properties gradle
            echo
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md

          git config user.name mustafa
          git config user.email mmuasfa@gmail.com
          git commit -qam "Release $next"
          git push origin HEAD:main
          echo "released=$next" >> "$GITHUB_OUTPUT"

      # A push made with this workflow's token starts no workflows, so start Release directly.
      - name: Publish it
        if: steps.bump.outputs.released != ''
        run: gh workflow run release.yml --ref main

