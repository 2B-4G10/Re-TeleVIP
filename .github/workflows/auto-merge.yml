name: Auto-merge

# Merges a pull request into main once Build APK (unit tests plus debug and release builds) has
# passed on its latest commit. Drafts are left alone: mark a pull request ready for review to let
# it merge, or turn it back into a draft to hold it. A failing pull request stays open for a look.
#
# Only pull requests from branches of this repository, opened by the owner or Dependabot, are
# merged. Dependabot's updates are squashed; everything else gets a merge commit made as the
# owner. A merge that changes versionName starts Release, since a push made with this workflow's
# token starts no workflows on its own.
on:
  workflow_run:
    workflows: [Build APK]
    types: [completed]
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Find the pull request
        id: pr
        run: |
          if [ -z "$NUMBER" ]; then
            NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
                --json number,headRefOid --jq ".[] | select(.headRefOid == \"$SHA\") | .number" | head -n1)
            if [ -z "$NUMBER" ]; then
              echo "No open pull request for $BRANCH at $SHA (already merged or updated since)."
              exit 0
            fi
          fi
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json number,title,state,isDraft,baseRefName,headRefName,headRefOid,isCrossRepository,author > pr.json
          read -r state draft base cross author head <<< "$(jq -r \
              '"\(.state) \(.isDraft) \(.baseRefName) \(.isCrossRepository) \(.author.login) \(.headRefOid)"' pr.json)"
          skip=""
          [ "$state" = OPEN ] || skip="it is $state"
          [ "$draft" = false ] || skip="it is a draft"
          [ "$base" = main ] || skip="it targets $base"
          [ "$cross" = false ] || skip="it comes from a fork"
          case "$author" in "$GITHUB_REPOSITORY_OWNER"|app/dependabot) ;; *) skip="it was opened by $author" ;; esac
          if [ -n "$SHA" ] && [ "$head" != "$SHA" ]; then skip="it has commits newer than this build"; fi
          # Marked ready for review: the latest Build APK on its newest commit has to have passed.
          if [ -z "$skip" ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=Build%20APK" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // "none"')
            [ "$result" = success ] || skip="Build APK has not passed on it yet ($result); it merges when it does"
          fi
          if [ -n "$skip" ]; then
            echo "Not merging #$NUMBER: $skip."
            exit 0
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .headRefName pr.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title pr.json)" >> "$GITHUB_OUTPUT"

      - name: Squash Dependabot's update
        if: steps.pr.outputs.author == 'app/dependabot'
        run: gh pr merge "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - uses: actions/checkout@v7
        if: steps.pr.outputs.number != '' && steps.pr.outputs.author != 'app/dependabot'
        with:
          ref: main
          fetch-depth: 0

      - name: Merge it into main
        id: merge
        if: steps.pr.outputs.number != '' && steps.pr.outputs.author != 'app/dependabot'
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          TITLE: ${{ steps.pr.outputs.title }}
        run: |
          git config user.name "Faisal AlDossary"
          git config user.email 62283064+2B-4G10@users.noreply.github.com
          git fetch -q origin "refs/pull/$PR/head"
          [ "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA" ] || { echo "#$PR changed since it was checked; not merging."; exit 0; }
          before=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          # Something may have landed on main in the meantime: merge onto it and try again.
          for attempt in 1 2 3; do
            if ! git merge -q --no-ff "$HEAD_SHA" -m "Merge pull request #$PR from $GITHUB_REPOSITORY_OWNER/$BRANCH" -m "$TITLE"; then
              git merge --abort || true
              echo "::error::#$PR does not merge cleanly into main. Update its branch and it merges once Build APK passes."
              exit 1
            fi
            git push -q origin HEAD:main && break
            [ "$attempt" = 3 ] && { echo "::error::Could not push the merge of #$PR to main."; exit 1; }
            sleep $((attempt * 10))
            git fetch -q origin main && git reset -q --hard origin/main
          done
          after=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          echo "Merged #$PR into main."
          [ "$before" = "$after" ] || echo "release=$after" >> "$GITHUB_OUTPUT"

      - name: Start Release
        if: steps.merge.outputs.release != ''
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
