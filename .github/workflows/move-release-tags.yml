name: Move release tags

# One-off: after main's history was rewritten, points each release tag at the rewritten commit
# with the same files, date and subject, so the old commits are no longer referenced. Releases
# follow their tags by name, so they and their APKs are unchanged. Safe to run more than once.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move the tags
        run: |
          git fetch --force --tags origin
          moved=""
          for t in $(git tag -l 'v*'); do
            old=$(git rev-parse "$t^{commit}")
            if git merge-base --is-ancestor "$old" origin/main; then
              echo "$t already on main"; continue
            fi
            key="$(git log -1 --format='%T %at %s' "$old")"
            new=$(git log origin/main --format='%H %T %at %s' | grep -F " $key" | head -n1 | cut -d' ' -f1)
            if [ -z "$new" ]; then
              echo "::warning::$t: no commit on main with the same files, date and subject; left as is."
              continue
            fi
            echo "$t: ${old:0:7} -> ${new:0:7}"
            git tag -f "$t" "$new"
            moved="$moved $t"
          done
          [ -z "$moved" ] || git push --force origin $moved
