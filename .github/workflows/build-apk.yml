name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      # The release APK is only signed (and installable) when the signing secrets are set.
      - name: Restore the signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run the unit tests
        timeout-minutes: 12
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Summarise the unit tests
        if: always()
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          reports = sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml'))
          if not reports:
              print("\n### Unit tests\n\nNo results were produced.")
              raise SystemExit(0)
          total = failed = skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              total += int(root.get('tests', 0))
              failed += int(root.get('failures', 0)) + int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          print(f"\n### Unit tests\n\n{total} run, {failed} failed, {skipped} skipped.")
          PY

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect the APKs
        id: collect
        run: |
          mkdir -p artifacts
          version=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          short_sha="${sha:0:7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/TeleVip-$version-$short_sha-debug.apk"
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          case "$release_apk" in
            *unsigned*) echo "::warning::No signing secrets set; the unsigned release APK is not published." ;;
            *) cp "$release_apk" "artifacts/TeleVip-$version-$short_sha-release.apk" ;;
          esac
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: TeleVip-${{ steps.collect.outputs.version }}-${{ steps.collect.outputs.short_sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Write the install instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## TeleVip ${{ steps.collect.outputs.version }} (\`${{ steps.collect.outputs.short_sha }}\`)

          1. Download the **TeleVip-…** artifact below and unzip it.
          2. Install the \`-debug.apk\` (a \`-release.apk\` is only included when it is signed).
          3. In LSPosed 1.10+ or Vector 2.2+: **Modules** → enable **TeleVip** → tick your clients.
          4. Force stop the client and reopen it.
          EOF
