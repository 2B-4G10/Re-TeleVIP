name: Toolchain update

# Every Monday, before Dependabot and Client watch: moves the build to the latest stable Android
# Gradle Plugin, Gradle, libxposed API (keeping module.prop's targetApiVersion in step) and Android
# SDK (compileSdk / targetSdk, and the platform every workflow installs), and
# pushes the change to main only if the unit tests and both APK builds pass with it. A bump that
# breaks the build is not pushed; the run fails and says which one it was. Client watch releases
# whatever landed if every client still checks out.
on:
  schedule:
    - cron: '37 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look for newer versions
        id: check
        run: |
          summary=$(.github/scripts/update-toolchain.sh)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "${summary:-Everything is current.}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.check.outputs.summary != ''
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.check.outputs.summary != ''
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.check.outputs.summary != ''

      - name: Build and test with the new versions
        id: build
        if: steps.check.outputs.summary != ''
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Push the update
        if: steps.check.outputs.summary != '' && steps.build.outcome == 'success'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          git config user.name "Faisal AlDossary"
          git config user.email 62283064+2B-4G10@users.noreply.github.com
          git commit -qam "Build: $SUMMARY"
          git push origin HEAD:main

      - name: Report a bump that breaks the build
        if: failure() && steps.check.outputs.summary != ''
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          echo "::error::The build fails with: $SUMMARY. Nothing was pushed; main keeps the current versions."
          echo "**Not pushed:** the build fails with $SUMMARY." >> "$GITHUB_STEP_SUMMARY"
