# Weekly dependency updates, opened on Monday morning before the Client watch run.
# Each pull request is merged automatically once Build APK passes on it (auto-merge.yml);
# the Client watch run then releases the result if every client still checks out.
# A release must be a week old before it is offered (cooldown), so a hijacked or broken version
# is usually pulled before it can reach a signed TeleVIP build. Security fixes skip the wait.
# Actions are pinned to commit SHAs; Dependabot moves the SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # Updated by toolchain-update.yml together with the Gradle wrapper and module.prop.
      - dependency-name: io.github.libxposed:api
      - dependency-name: com.android.application
      - dependency-name: com.android.tools.build:gradle
    cooldown:
      default-days: 7
    commit-message:
      prefix: Build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: CI
